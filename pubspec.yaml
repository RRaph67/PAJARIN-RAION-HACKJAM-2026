name: raion_hackjam15
description: "RaionHackJam15 - Flutter Hackathon Project"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── State Management ────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── Navigation ──────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Responsive UI ───────────────────────────────────────────
  flutter_screenutil: ^5.9.3

  # ── SVG Support ─────────────────────────────────────────────
  flutter_svg: ^2.0.17

  # ── Backend / Auth ──────────────────────────────────────────
  supabase_flutter: ^2.9.0

  # ── HTTP Client ─────────────────────────────────────────────
  dio: ^5.8.0+1

  # ── Local Storage ───────────────────────────────────────────
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
