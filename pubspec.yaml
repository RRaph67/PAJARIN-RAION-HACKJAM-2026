name: pajarin
description: "Pajarin - Aplikasi Edukasi Pajak"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── State Management ────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── Navigation ──────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Responsive UI ───────────────────────────────────────────
  flutter_screenutil: ^5.9.3

  # ── SVG Support ─────────────────────────────────────────────
  flutter_svg: ^2.0.17

  # ── Backend / Auth ──────────────────────────────────────────
  supabase_flutter: ^2.9.0

  # ── HTTP Client ─────────────────────────────────────────────
  dio: ^5.8.0+1

  # ── Local Storage ───────────────────────────────────────────
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # ── Assets ────────────────────────────────────────────────────────────────
  assets:
    - assets/fonts/
    - assets/svg/
    - assets/images/

  # ── Custom Fonts ──────────────────────────────────────────────────────────
  # Font Nunito — digunakan sebagai font utama seluruh aplikasi.
  # family name harus sama persis dengan fontFamily di app_typography.dart.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800

# ── Flutter Launcher Icons ────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_square.png"
  remove_alpha_ios: true
  background_color: "#FFFAEC"
  adaptive_icon_background: "#FFFAEC"
  adaptive_icon_foreground: "assets/images/logo_square.png"
  min_sdk_android: 21
